name: LumiTags
version: '${project.version}'
main: org.luminaramc.lumitags.LumiTags
api-version: '1.20'
description: A high-performance Java plugin to manage player rank nicknames using LuckPerms.
authors: [saboooor]
depend: [LuckPerms]

commands:
  lumitag:
    description: Manage user rank nicknames
    aliases: [lumitags]
    usage: /lumitag

permissions:
  lumitags.give:
    description: Allows creating transferable prefix items.
    default: op
  lumitags.use:
    description: Allows users to set their own custom tag text.
    default: op
  lumitags.presets:
    description: Allows selecting configured presets directly with set commands.
    default: op
  lumitags.moderator:
    description: Allows staff to change other users' rank nicknames.
    default: op
  lumitags.admin:
    description: Allows admins to reload the plugin configuration.
    default: op
